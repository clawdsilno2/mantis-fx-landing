<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantis FX - Start Trading Today</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0a0a0a 0%,#121008 30%,#1a1508 60%,#0a0a0a 100%);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}

.card{width:100%;max-width:420px;background:rgba(255,255,255,0.04);border:1px solid rgba(212,175,55,0.12);border-radius:20px;padding:2.5rem 2rem 2rem;text-align:center;backdrop-filter:blur(10px)}

.logo-icon{width:70px;height:70px;margin:0 auto 2rem;background:rgba(212,175,55,0.12);border-radius:16px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:36px;height:36px;fill:none;stroke:#D4AF37;stroke-width:2;stroke-linecap:round}

h1{font-size:1.7rem;font-weight:800;margin-bottom:0.8rem}
.subtitle{color:rgba(255,255,255,0.7);font-size:0.95rem;line-height:1.5;margin-bottom:2rem;padding:0 0.5rem}

.timer-section{margin-bottom:2rem}
.timer-label{font-size:0.85rem;color:rgba(255,255,255,0.6);margin-bottom:0.5rem;font-weight:500}
.timer{font-size:2.5rem;font-weight:800;letter-spacing:3px;color:#fff;font-variant-numeric:tabular-nums}

.btn-group{display:flex;flex-direction:column;gap:0.8rem;margin-bottom:1.5rem}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:0.6rem;width:100%;padding:1rem;background:linear-gradient(135deg,#D4AF37,#E8C84A);color:#0a0a0a;font-weight:700;font-size:1rem;border:none;border-radius:12px;cursor:pointer;text-decoration:none;transition:all 0.3s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(212,175,55,0.3)}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:0.6rem;width:100%;padding:1rem;background:transparent;color:#fff;font-weight:600;font-size:0.95rem;border:1px solid rgba(255,255,255,0.2);border-radius:12px;cursor:pointer;text-decoration:none;transition:all 0.3s}
.btn-secondary:hover{border-color:rgba(212,175,55,0.5);background:rgba(212,175,55,0.05)}

.tg-icon{width:22px;height:22px;flex-shrink:0}

.card-footer{padding-top:0.5rem}
.card-footer a{color:rgba(255,255,255,0.35);font-size:0.7rem;text-decoration:none;margin:0 0.5rem}
.card-footer a:hover{color:rgba(255,255,255,0.6)}
.card-footer .dot{color:rgba(255,255,255,0.2);font-size:0.7rem}
</style>
</head>
<body>

<div class="card">
  <div class="logo-icon">
    <svg viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="14" stroke-width="2.5"/>
      <line x1="20" y1="10" x2="20" y2="30"/>
      <line x1="14" y1="14" x2="20" y2="20"/>
      <line x1="26" y1="14" x2="20" y2="20"/>
      <line x1="14" y1="26" x2="20" y2="20"/>
      <line x1="26" y1="26" x2="20" y2="20"/>
    </svg>
  </div>

  <h1>Start Trading Today! 🚀</h1>
  <p class="subtitle">Discover how traders are using our gold signals to grow consistently!</p>

  <div class="timer-section">
    <div class="timer-label">Try FREE Before it's Too Late</div>
    <div class="timer" id="countdown">00:15:00</div>
  </div>

  <div class="btn-group">
    <a href="https://t.me/fxmantis" class="btn-primary" target="_blank">
      <svg class="tg-icon" viewBox="0 0 24 24"><path fill="#0a0a0a" d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.53 8.16l-1.8 8.49c-.14.6-.5.75-1.01.47l-2.8-2.06-1.35 1.3c-.15.15-.28.28-.57.28l.2-2.85 5.18-4.68c.22-.2-.05-.31-.35-.12L8.86 13.73l-2.75-.86c-.6-.19-.61-.6.12-.88l10.76-4.15c.5-.18.93.12.77.88l-.23-.56z"/></svg>
      Join our Telegram Group for FREE!
    </a>
    <a href="https://t.me/fxmantis" class="btn-secondary" target="_blank">
      <svg class="tg-icon" viewBox="0 0 24 24"><path fill="#fff" d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.53 8.16l-1.8 8.49c-.14.6-.5.75-1.01.47l-2.8-2.06-1.35 1.3c-.15.15-.28.28-.57.28l.2-2.85 5.18-4.68c.22-.2-.05-.31-.35-.12L8.86 13.73l-2.75-.86c-.6-.19-.61-.6.12-.88l10.76-4.15c.5-.18.93.12.77.88l-.23-.56z"/></svg>
      Send us a Direct Message
    </a>
  </div>

  <div class="card-footer">
    <a href="#">Cookie Preferences</a>
    <span class="dot">&bull;</span>
    <a href="#">Report</a>
    <span class="dot">&bull;</span>
    <a href="#">Privacy</a>
  </div>
</div>

<script>
let totalSeconds = 15 * 60;
const timerEl = document.getElementById('countdown');
function updateTimer() {
  if (totalSeconds <= 0) totalSeconds = 15 * 60;
  const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
  const s = String(totalSeconds % 60).padStart(2, '0');
  timerEl.textContent = h + ':' + m + ':' + s;
  totalSeconds--;
}
updateTimer();
setInterval(updateTimer, 1000);
</script>

</body>
</html>
